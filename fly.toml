# Fly.io: `fly launch --copy-config --no-deploy` then `fly deploy`
# Without IC_API_KEYS the app is a public demo (scenarios + mock provider, simulated runbooks).
# Secrets: `fly secrets set IC_API_KEYS=... IC_APPROVER_KEYS=...`
app = "incident-commander-ai"
primary_region = "bom"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  IC_PROVIDER = "mock"
  IC_TRUST_PROXY = "true"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
